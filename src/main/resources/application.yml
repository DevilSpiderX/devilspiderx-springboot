server:
  port: ${SERVER_PORT:8080}
  http2:
    enabled: true

spring:
  application:
    name: DevilSpiderX
  banner:
    location: classpath:banner.txt
  main:
    banner-mode: LOG
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/devilspiderx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    # password:
  data:
    redis:
      host: localhost
      port: 6379
      # password:
      database: 7

logging:
  file:
    path: ./log

sa-token:
  token-name: DSXSessionId
  is-concurrent: true
  is-share: false
  is-read-cookie: false

springdoc:
  api-docs:
    enabled: false

management:
  endpoints:
    access:
      default: none